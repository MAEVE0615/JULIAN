      /*
       * 开屏（约 1.7 秒，冷启动播一次，点一下跳过）：
       * 签名从左到右写出（光晕随之浮现）→ 背景褪去，签名本身移动、缩放到欢迎页签名的位置，
       * 落定后直接交给欢迎页（同一个签名接力，不切换、不闪）。
       */
      #white-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        -webkit-user-select: none;
        user-select: none;
      }
      #white-splash .bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 70% at 50% 40%, #141a2e 0%, #0b0d14 62%);
        transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #white-splash.light .bg {
        background: radial-gradient(120% 70% at 50% 40%, #ffffff 0%, #f6f7fb 62%);
      }
      #white-splash.handoff .bg {
        opacity: 0;
      }
      #white-splash.handoff {
        pointer-events: none;
      }
      #white-splash .sig {
        position: absolute;
        top: 42%;
        left: 50%;
        width: 200px;
        height: 79px;
        margin: -40px 0 0 -100px;
        transform-origin: 0 0;
        transition:
          transform 560ms cubic-bezier(0.65, 0, 0.35, 1),
          opacity 300ms ease;
      }
      #white-splash img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        -webkit-user-drag: none;
      }
      #white-splash .ink {
        -webkit-mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
        mask-image: linear-gradient(90deg, #000 40%, transparent 60%);
        -webkit-mask-size: 260% 100%;
        mask-size: 260% 100%;
        animation: white-splash-write 900ms cubic-bezier(0.45, 0, 0.25, 1) 80ms both;
      }
      #white-splash .glow {
        opacity: 0;
        filter: blur(11px);
        animation: white-splash-glow 1150ms ease 80ms both;
      }
      @keyframes white-splash-write {
        from {
          -webkit-mask-position: 100% 0;
          mask-position: 100% 0;
        }
        to {
          -webkit-mask-position: 0 0;
          mask-position: 0 0;
        }
      }
      /* 光晕随书写慢慢浮现，直接停在与欢迎页签名相同的亮度，不再闪一下 */
      @keyframes white-splash-glow {
        0%,
        35% {
          opacity: 0;
        }
        100% {
          opacity: 0.25;
        }
      }
      #white-splash.light .glow {
        animation-name: white-splash-glow-light;
      }
      @keyframes white-splash-glow-light {
        0%,
        35% {
          opacity: 0;
        }
        100% {
          opacity: 0.18;
        }
      }
      /* 开屏期间先把欢迎页的签名藏起来，等开屏的签名飞过去接上 */
      html[data-splash] [data-splash-target] {
        visibility: hidden;
      }
      @media (prefers-reduced-motion: reduce) {
        #white-splash .ink,
        #white-splash .glow {
          animation: none;
        }
        #white-splash .sig,
        #white-splash .bg {
          transition-duration: 1ms;
        }
      }
